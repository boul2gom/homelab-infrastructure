name: photos-storage

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  immich-server:
    <<: *defaults
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    networks:
      - photos-network
      - data-network
    volumes:
      - /srv/data/photos:/data
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri
    environment:
      TZ: ${TZ}
      IMMICH_ALLOW_SETUP: "true"
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
    depends_on:
      immich-postgres:
        condition: service_healthy
    healthcheck:
      disable: false
    labels:
      proxy.aliases: photos
      proxy.photos.homepage.name: "Immich"
      proxy.photos.homepage.icon: "@selfhst/immich.svg"
      proxy.photos.homepage.category: "Photos"

  immich-machine-learning:
    <<: *defaults
    image: ghcr.io/immich-app/immich-machine-learning:release-openvino
    container_name: immich-machine-learning
    networks:
      - photos-network
    volumes:
      - /srv/containers/Immich/Cache:/cache
    devices:
      - /dev/dri:/dev/dri
    environment:
      MACHINE_LEARNING_WORKERS: 1
    healthcheck:
      disable: false

  immich-postgres:
    <<: *defaults
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1
    container_name: immich-postgres
    networks:
      - photos-network
    volumes:
      - /srv/containers/Immich/Postgres:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s

  immich-atlas:
    <<: *defaults
    image: ghcr.io/guimartins/immich-atlas:latest
    container_name: immich-atlas
    networks:
      - photos-network
    volumes:
      - /srv/containers/Immich/Atlas:/appdata
      - /srv/data/photos:/upload:ro
    environment:
      IMMICH_URL: http://immich-server:2283
      IMMICH_API_KEY: ${IMMICH_API_KEY}
    depends_on:
      immich-server:
        condition: service_healthy
    labels:
      proxy.aliases: photos-stats
      proxy.idle_timeout: 15m
      proxy.#1.middlewares.oidc:
      proxy.photos-stats.homepage.name: "Immich Atlas"
      proxy.photos-stats.homepage.icon: "https://gist.githubusercontent.com/boul2gom/5a4b4d4fe3bc663bae2f43a8aad65b0b/raw/c4a70570a62c54ddc245331aa60fa8e8ed6c97c0/immich-atlas.svg"
      proxy.photos-stats.homepage.category: "Photos"

networks:
  photos-network:
    driver: bridge
    name: photos-network
  data-network:
    external: true