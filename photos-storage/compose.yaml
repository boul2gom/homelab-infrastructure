name: photos-storage

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  immich-server:
    <<: *defaults
    image: ghcr.io/immich-app/immich-server:v3.4.1
    container_name: immich-server
    networks:
      - photos-network
      - data-network
      - proxy-network
    volumes:
      - /srv/data/photos:/data
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri
    environment:
      TZ: ${TZ}
      IMMICH_ALLOW_SETUP: "true"
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
    depends_on:
      immich-postgres:
        condition: service_healthy
    healthcheck:
      disable: false
    labels:
      traefik.enable: "true"
      traefik.http.routers.immich.rule: "Host(`photos.boul2gom.com`)"
      traefik.http.routers.immich.entrypoints: "websecure"
      traefik.http.services.immich.loadbalancer.server.port: "2283"

  immich-machine-learning:
    <<: *defaults
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1-openvino
    container_name: immich-machine-learning
    networks:
      - photos-network
    volumes:
      - /srv/containers/Immich/Cache:/cache
    devices:
      - /dev/dri:/dev/dri
    environment:
      MACHINE_LEARNING_WORKERS: 1
    healthcheck:
      disable: false

  immich-postgres:
    <<: *defaults
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1
    container_name: immich-postgres
    networks:
      - photos-network
    volumes:
      - /srv/containers/Immich/Postgres:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s

networks:
  photos-network:
    driver: bridge
    name: photos-network
  data-network:
    external: true
  proxy-network:
    external: true