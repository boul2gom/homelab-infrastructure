name: network-gateway

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      
services:
  godoxy:
    <<: *defaults
    image: ghcr.io/yusing/godoxy:v0.34.0
    container_name: godoxy
    user: 1000:1000
    group_add:
      - "989"
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "/srv/containers/GoDoxy/Error Pages:/app/error_pages:ro"
      - /srv/containers/GoDoxy/Config:/app/config
      - /srv/containers/GoDoxy/Logs:/app/logs
      - /srv/containers/GoDoxy/Data:/app/data
      - /srv/containers/GoDoxy/Certs:/app/certs
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TZ: ${TZ}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      GODOXY_API_USER: ${GODOXY_API_USER}
      GODOXY_API_PASSWORD: ${GODOXY_API_PASSWORD}
      GODOXY_API_JWT_SECURE: "true"
      GODOXY_API_JWT_SECRET: ${GODOXY_API_JWT_SECRET}
      GODOXY_OIDC_REDIRECT_URL: https://proxy.boul2gom.com/api/auth/callback
      GODOXY_OIDC_ISSUER_URL: https://auth.boul2gom.com
      GODOXY_OIDC_CLIENT_ID: ${GODOXY_OIDC_CLIENT_ID}
      GODOXY_OIDC_CLIENT_SECRET: ${GODOXY_OIDC_CLIENT_SECRET}
      GODOXY_OIDC_SCOPES: openid,profile,email,groups
      GODOXY_OIDC_ALLOWED_GROUPS: maison
      GODOXY_METRICS_DISABLE_GPU: "true"
      
  traefik:
    <<: *defaults
    image: traefik:v3.7.19
    container_name: traefik
    user: 1000:1000
    group_add:
      - "989"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - proxy-network
    ports:
      # Ports temporaires pour test parallèle sans couper GoDoxy / NetBird VPN.
      # À passer sur "80:80" et "443:443" au moment de la bascule (après arrêt de godoxy).
      - "8088:80"
      - "8443:443"
    # Avoid conflict with FileLoader/FlagLoader and allow Renovate to update plugins
    command:
      - "--global.sendAnonymousUsage=false"
      - "--api=true"
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--ping=true"
      - "--ping.entryPoint=traefik"
      # Logs & Access Logs JSON
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"
      - "--accesslog.format=json"
      - "--accesslog.bufferingsize=100"
      - "--accesslog.fields.defaultmode=keep"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.CF-Connecting-IP=keep"
      - "--accesslog.fields.headers.names.X-Forwarded-For=keep"
      - "--accesslog.fields.headers.names.X-Real-IP=keep"
      # EntryPoints
      - "--entrypoints.traefik.address=:8080"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.asDefault=true"
      - "--entrypoints.websecure.http.tls.certResolver=cloudflare"
      - "--entrypoints.websecure.http.tls.domains[0].main=boul2gom.com"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.boul2gom.com"
      - "--entrypoints.websecure.http.middlewares=cloudflare-realip@file,security-headers@file"
      # Wildcard Let's Encrypt certificates with DNS-01 Cloudflare (Handle split-horizon with NetBird/Blocky)
      - "--certificatesresolvers.cloudflare.acme.email=louisdechorivit@gmail.com"
      - "--certificatesresolvers.cloudflare.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.propagation.delayBeforeChecks=15s"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=proxy-network"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Plugins (keep .version after name for Renovate regex)
      - "--experimental.plugins.sablier.moduleName=github.com/sablierapp/sablier-traefik-plugin"
      - "--experimental.plugins.sablier.version=v1.4.0"
      - "--experimental.plugins.traefik-real-ip.moduleName=github.com/zekihan/traefik-real-ip"
      - "--experimental.plugins.traefik-real-ip.version=v0.3.1"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/containers/Traefik/Dynamic:/etc/traefik/dynamic:ro
      - /srv/containers/Traefik/Certs:/certs
      - /srv/containers/Traefik/Logs:/logs
      - /srv/containers/Traefik/Plugins:/plugins-storage
    environment:
      TZ: ${TZ}
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik-api.rule: "PathPrefix(`/api`)"
      traefik.http.routers.traefik-api.entrypoints: "traefik"
      traefik.http.routers.traefik-api.service: "api@internal"
      traefik.http.routers.traefik-api.middlewares: "traefik-api-auth@file"
      
  traefik-manager:
    <<: *defaults
    image: ghcr.io/chr0nzz/traefik-manager:v1.15.8
    container_name: traefik-manager
    networks:
      - proxy-network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/containers/TraefikManager/Config:/app/config
      - /srv/containers/TraefikManager/Backups:/app/backups
      - /srv/containers/Traefik/Dynamic:/app/dynamic:rw
      - /srv/containers/Traefik/Certs/acme.json:/app/acme.json:ro
      - /srv/containers/Traefik/Logs/access.log:/app/logs/access.log:ro
    environment:
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
      LOG_LEVEL: "INFO"
      TRAEFIK_API_URL: "http://traefik:8080"
      TRAEFIK_API_USER: "${TRAEFIK_API_USER}"
      TRAEFIK_API_PASSWORD: "${TRAEFIK_API_PASSWORD}"
      DOMAINS: "boul2gom.com"
      CERT_RESOLVER: "cloudflare"
      CONFIG_DIR: "/app/dynamic"
      SETTINGS_PATH: "/app/config/manager.yml"
      ACME_JSON_PATH: "/app/acme.json"
      ACCESS_LOG_PATH: "/app/logs/access.log"
      BACKUP_DIR: "/app/backups"
      AUTH_ENABLED: "true"
      COOKIE_SECURE: "true"
      PROXY_FIX_HOPS: "1"
      OIDC_ENABLED: "true"
      OIDC_PROVIDER_URL: "https://auth.boul2gom.com"
      OIDC_CLIENT_ID: "${TRAEFIK_MANAGER_OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${TRAEFIK_MANAGER_OIDC_CLIENT_SECRET}"
      OIDC_DISPLAY_NAME: "Pocket ID"
      OIDC_ALLOWED_GROUPS: "maison"
      OIDC_GROUPS_CLAIM: "groups"
      OIDC_AUTO_LOGIN: "true"
      OIDC_REDIRECT_URI: "https://proxy.boul2gom.com/auth/oidc/callback"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "true"
      traefik.docker.allownonrunning: "true"
      traefik.http.routers.traefik-manager.rule: "Host(`proxy.boul2gom.com`)"
      traefik.http.routers.traefik-manager.entrypoints: "websecure"
      traefik.http.routers.traefik-manager.middlewares: "sablier-traefik-manager@docker"
      traefik.http.services.traefik-manager.loadbalancer.server.port: "5000"
      traefik.http.middlewares.sablier-traefik-manager.plugin.sablier.sablierUrl: "http://sablier:10000"
      traefik.http.middlewares.sablier-traefik-manager.plugin.sablier.group: "traefik-manager"
      traefik.http.middlewares.sablier-traefik-manager.plugin.sablier.sessionDuration: "15m"
      traefik.http.middlewares.sablier-traefik-manager.plugin.sablier.dynamic.displayName: "Traefik Manager"
      sablier.enable: "true"
      sablier.group: "traefik-manager"
      
  sablier:
    <<: *defaults
    image: ghcr.io/sablierapp/sablier:1.21.1
    container_name: sablier
    user: 1000:1000
    group_add:
      - "989"
    cap_drop:
      - ALL
    networks:
      - proxy-network
    command:
      - start
      - --configFile=/etc/sablier/sablier.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/containers/Sablier/Config/sablier.yaml:/etc/sablier/sablier.yaml:ro
      - /srv/containers/Sablier/Data:/data
    environment:
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "/bin/sablier", "health", "--url", "http://127.0.0.1:10000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      
  tinyauth:
    <<: *defaults
    image: ghcr.io/tinyauthapp/tinyauth:v5.2.0
    container_name: tinyauth
    user: 1000:1000
    cap_drop:
      - ALL
    networks:
      - proxy-network
      - data-network
    volumes:
      - /srv/containers/Tinyauth:/data
    environment:
      TZ: ${TZ}
      TINYAUTH_APPURL: "https://access.boul2gom.com"
      TINYAUTH_ANALYTICS_ENABLED: "false"
      TINYAUTH_LABELPROVIDER: "none"
      TINYAUTH_DATABASE_DRIVER: "postgres"
      TINYAUTH_DATABASE_PATH: "postgres://tinyauth:${TINYAUTH_DB_PASSWORD}@postgres:5432/tinyauth?sslmode=disable"
      TINYAUTH_AUTH_SECURECOOKIE: "true"
      TINYAUTH_AUTH_SESSIONEXPIRY: "86400"
      TINYAUTH_OAUTH_AUTOREDIRECT: "pocketid"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: "Pocket ID"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID: "${TINYAUTH_OIDC_CLIENT_ID}"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET: "${TINYAUTH_OIDC_CLIENT_SECRET}"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: "https://auth.boul2gom.com/authorize"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: "https://auth.boul2gom.com/api/oidc/token"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: "https://auth.boul2gom.com/api/oidc/userinfo"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL: "https://access.boul2gom.com/api/oauth/callback/pocketid"
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: "openid,email,profile,groups"
    healthcheck:
      test: ["CMD", "tinyauth", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.tinyauth.rule: "Host(`access.boul2gom.com`)"
      traefik.http.routers.tinyauth.entrypoints: "websecure"
      traefik.http.services.tinyauth.loadbalancer.server.port: "3000"
      
  homarr:
    <<: *defaults
    image: ghcr.io/homarr-labs/homarr:v2.14.0
    container_name: homarr
    networks:
      - proxy-network
      - data-network
      - gateway-network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/containers/Homarr:/appdata
    environment:
      TZ: ${TZ}
      LOG_LEVEL: "info"
      BASE_URL: "https://home.boul2gom.com"
      SECRET_ENCRYPTION_KEY: "${HOMARR_SECRET_ENCRYPTION_KEY}"
      DB_DIALECT: "postgresql"
      DB_DRIVER: "node-postgres"
      DB_URL: "postgres://homarr:${HOMARR_DB_PASSWORD}@postgres:5432/homarr"
      REDIS_IS_EXTERNAL: "true"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DATABASE_INDEX: "1"
      AUTH_PROVIDERS: "oidc,credentials"
      AUTH_OIDC_ISSUER: "https://auth.boul2gom.com"
      AUTH_OIDC_CLIENT_ID: "${HOMARR_OIDC_CLIENT_ID}"
      AUTH_OIDC_CLIENT_SECRET: "${HOMARR_OIDC_CLIENT_SECRET}"
      AUTH_OIDC_CLIENT_NAME: "Pocket ID"
      AUTH_OIDC_AUTO_LOGIN: "false"
      AUTH_OIDC_SCOPE_OVERWRITE: "openid email profile groups"
      AUTH_OIDC_GROUPS_ATTRIBUTE: "groups"
      ENABLE_DOCKER: "true"
      ENABLE_KUBERNETES: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7575/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      traefik.enable: "true"
      traefik.http.routers.homarr.rule: "Host(`home.boul2gom.com`)"
      traefik.http.routers.homarr.entrypoints: "websecure"
      traefik.http.services.homarr.loadbalancer.server.port: "7575"
      
  cloudflare-ddns:
    <<: *defaults
    image: timothyjmiller/cloudflare-ddns:2.3.1
    container_name: cloudflare-ddns
    network_mode: host
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DOMAINS: eu-west-3.boul2gom.com
      PROXIED: "true"
      
  blocky:
    <<: *defaults
    image: ghcr.io/0xerr0r/blocky:v0.37.0
    container_name: blocky
    user: 1000:1000
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - gateway-network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/containers/Blocky/config.yml:/app/config.yml:ro
      - /srv/containers/Blocky/Cache:/data/cache
      - /srv/containers/Blocky/Logs:/logs
    environment:
      TZ: ${TZ}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      
  blocky-ui:
    <<: *defaults
    image: ghcr.io/gabeduartem/blocky-ui:2.2.0
    container_name: blocky-ui
    depends_on:
      - blocky
    networks:
      - gateway-network
      - proxy-network
    volumes:
      - /srv/containers/Blocky/Logs:/logs:ro
    environment:
      BLOCKY_API_URL: http://blocky:4000
      QUERY_LOG_TYPE: sqlite
      QUERY_LOG_TARGET: /logs/querylog.db
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      # --- GoDoxy (à supprimer après bascule) ---
      proxy.aliases: dns
      proxy.#1.middlewares.oidc:
      proxy.dns.homepage.name: "Blocky UI"
      proxy.dns.homepage.icon: "@selfhst/blocky.svg"
      proxy.dns.homepage.category: "Network"
      # --- Traefik + Sablier ---
      traefik.enable: "true"
      traefik.docker.allownonrunning: "true"
      traefik.http.routers.blocky-ui.rule: "Host(`dns.boul2gom.com`)"
      traefik.http.routers.blocky-ui.entrypoints: "websecure"
      traefik.http.routers.blocky-ui.middlewares: "tinyauth@file,sablier-blocky-ui@docker"
      traefik.http.services.blocky-ui.loadbalancer.server.port: "3000"
      traefik.http.middlewares.sablier-blocky-ui.plugin.sablier.sablierUrl: "http://sablier:10000"
      traefik.http.middlewares.sablier-blocky-ui.plugin.sablier.group: "blocky-ui"
      traefik.http.middlewares.sablier-blocky-ui.plugin.sablier.sessionDuration: "15m"
      traefik.http.middlewares.sablier-blocky-ui.plugin.sablier.dynamic.displayName: "Blocky UI"
      sablier.enable: "true"
      sablier.group: "blocky-ui"
      
  netbird-dashboard:
    <<: *defaults
    image: netbirdio/dashboard:v2.98.0
    container_name: netbird-dashboard
    networks:
      - gateway-network
      - proxy-network
    environment:
      NETBIRD_MGMT_API_ENDPOINT: https://vpn.boul2gom.com:443
      NETBIRD_MGMT_GRPC_API_ENDPOINT: https://vpn.boul2gom.com:443
      AUTH_AUTHORITY: https://auth.boul2gom.com
      AUTH_AUDIENCE: ${NETBIRD_POCKETID_CLIENT_ID}
      AUTH_CLIENT_ID: ${NETBIRD_POCKETID_CLIENT_ID}
      AUTH_CLIENT_SECRET: ${NETBIRD_POCKETID_CLIENT_SECRET}
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: openid profile email groups
      AUTH_REDIRECT_URI: /auth
      AUTH_SILENT_REDIRECT_URI: /silent-auth
      NETBIRD_TOKEN_SOURCE: idToken
      NGINX_SSL_PORT: 80
    depends_on:
      - netbird-management
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      # --- GoDoxy (à supprimer après bascule) ---
      proxy.aliases: vpn-ui
      proxy.vpn-ui.port: "80"
      proxy.*.homepage.show: "false"
      # --- Traefik ---
      traefik.enable: "true"
      traefik.http.routers.netbird-ui.rule: "Host(`vpn.boul2gom.com`)"
      traefik.http.routers.netbird-ui.entrypoints: "websecure"
      traefik.http.routers.netbird-ui.priority: "1"
      traefik.http.services.netbird-ui.loadbalancer.server.port: "80"

  netbird-management:
    <<: *defaults
    image: netbirdio/management:0.83.2
    container_name: netbird-management
    expose:
      - "33073"
    networks:
      - data-network
      - gateway-network
      - proxy-network
    volumes:
      - /srv/containers/NetBird/Manager:/var/lib/netbird
      - /srv/containers/NetBird/Config/management.json:/etc/netbird/management.json
    command: [
      "--port", "33073",
      "--log-file", "console",
      "--log-level", "error",
      "--disable-anonymous-metrics=true",
      "--single-account-mode-domain=vpn.boul2gom.com",
      "--dns-domain=netbird.selfhosted"
    ]
    environment:
      NETBIRD_STORE_ENGINE_POSTGRES_DSN: postgres://netbird:${NETBIRD_POSTGRES_PASSWORD}@postgres:5432/netbird?sslmode=disable
      NETBIRD_MGMT_IDP: pocketid
      NETBIRD_IDP_MGMT_CLIENT_ID: ${NETBIRD_POCKETID_CLIENT_ID}
      NETBIRD_IDP_MGMT_EXTRA_MANAGEMENT_ENDPOINT: https://auth.boul2gom.com
      NETBIRD_IDP_MGMT_EXTRA_API_TOKEN: ${NETBIRD_POCKETID_API_TOKEN}
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/33073"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      # --- GoDoxy (à supprimer après bascule) ---
      proxy.aliases: vpn, mesh, mesh-http, mesh-grpc
      proxy.*.healthcheck.disable: "true"    
      proxy.vpn.homepage.name: "NetBird"
      proxy.vpn.homepage.icon: "@selfhst/netbird.svg"
      proxy.vpn.homepage.category: "Network"
      proxy.mesh.homepage.show: "false"
      proxy.mesh-http.homepage.show: "false"
      proxy.mesh-grpc.homepage.show: "false"
      proxy.mesh-http.scheme: http
      proxy.mesh-grpc.scheme: h2c      
      proxy.vpn.rules: |
        header Content-Type glob(application/grpc*) {
          route mesh-grpc
        }
        path glob(/api/*) | path glob(/ws-proxy/*) {
          route mesh-http
        }
        default {
          route vpn-ui
        }
      proxy.mesh.rules: |
        header Content-Type glob(application/grpc*) {
          route mesh-grpc
        }
        path glob(/*) {
          route mesh-http
        }
      # --- Traefik ---
      traefik.enable: "true"
      traefik.http.routers.netbird-mgmt-grpc.rule: "(Host(`vpn.boul2gom.com`) || Host(`mesh.boul2gom.com`)) && HeaderRegexp(`Content-Type`, `^application/grpc`)"
      traefik.http.routers.netbird-mgmt-grpc.entrypoints: "websecure"
      traefik.http.routers.netbird-mgmt-grpc.priority: "100"
      traefik.http.routers.netbird-mgmt-grpc.service: "netbird-mgmt-grpc"
      traefik.http.services.netbird-mgmt-grpc.loadbalancer.server.port: "33073"
      traefik.http.services.netbird-mgmt-grpc.loadbalancer.server.scheme: "h2c"
      traefik.http.routers.netbird-mgmt-http.rule: "(Host(`vpn.boul2gom.com`) && (PathPrefix(`/api`) || PathPrefix(`/ws-proxy`))) || Host(`mesh.boul2gom.com`)"
      traefik.http.routers.netbird-mgmt-http.entrypoints: "websecure"
      traefik.http.routers.netbird-mgmt-http.priority: "50"
      traefik.http.routers.netbird-mgmt-http.service: "netbird-mgmt-http"
      traefik.http.services.netbird-mgmt-http.loadbalancer.server.port: "33073"

  netbird-signal:
    <<: *defaults
    image: netbirdio/signal:0.83.2
    container_name: netbird-signal
    expose:
      - "80"
    networks:
      - gateway-network
      - proxy-network
    volumes:
      - /srv/containers/NetBird/Signal:/var/lib/netbird
    healthcheck:
      test: ["CMD", "/busybox/wget", "--spider", "-q", "http://127.0.0.1:9090/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      # --- GoDoxy (à supprimer après bascule) ---
      proxy.aliases: negotiate, negotiate-http, negotiate-grpc
      proxy.*.homepage.show: "false"
      proxy.*.healthcheck.disable: "true"
      proxy.negotiate-http.scheme: http
      proxy.negotiate-grpc.scheme: h2c
      proxy.negotiate.rules: |
        header Content-Type glob(application/grpc*) {
          route negotiate-grpc
        }
        path glob(/*) {
          route negotiate-http
        }
      # --- Traefik ---
      traefik.enable: "true"
      traefik.http.routers.netbird-signal-grpc.rule: "Host(`negotiate.boul2gom.com`) && HeaderRegexp(`Content-Type`, `^application/grpc`)"
      traefik.http.routers.netbird-signal-grpc.entrypoints: "websecure"
      traefik.http.routers.netbird-signal-grpc.priority: "100"
      traefik.http.routers.netbird-signal-grpc.service: "netbird-signal-grpc"
      traefik.http.services.netbird-signal-grpc.loadbalancer.server.port: "80"
      traefik.http.services.netbird-signal-grpc.loadbalancer.server.scheme: "h2c"
      traefik.http.routers.netbird-signal-http.rule: "Host(`negotiate.boul2gom.com`)"
      traefik.http.routers.netbird-signal-http.entrypoints: "websecure"
      traefik.http.routers.netbird-signal-http.priority: "10"
      traefik.http.routers.netbird-signal-http.service: "netbird-signal-http"
      traefik.http.services.netbird-signal-http.loadbalancer.server.port: "80"

  netbird-relay:
    <<: *defaults
    image: netbirdio/relay:0.83.2
    container_name: netbird-relay
    expose:
      - "33080"
    networks:
      - gateway-network
      - proxy-network
    environment:
      NB_LOG_LEVEL: info
      NB_LISTEN_ADDRESS: :33080
      NB_EXPOSED_ADDRESS: rels://relay.boul2gom.com:443/relay
      NB_AUTH_SECRET: ${NETBIRD_AUTH_SECRET}
    labels:
      # --- GoDoxy (à supprimer après bascule) ---
      proxy.aliases: relay
      proxy.relay.homepage.show: "false"
      # --- Traefik ---
      traefik.enable: "true"
      traefik.http.routers.netbird-relay.rule: "Host(`relay.boul2gom.com`)"
      traefik.http.routers.netbird-relay.entrypoints: "websecure"
      traefik.http.services.netbird-relay.loadbalancer.server.port: "33080"
      
  netbird-client:
    <<: *defaults
    image: netbirdio/netbird:0.83.2
    container_name: netbird-client
    network_mode: host
    extra_hosts:
      - "negotiate.boul2gom.com:127.0.0.1"
      - "relay.boul2gom.com:127.0.0.1"
      - "mesh.boul2gom.com:127.0.0.1"
      - "vpn.boul2gom.com:127.0.0.1"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /srv/containers/NetBird/Client:/var/lib/netbird
    environment:
      NB_MANAGEMENT_URL: "https://vpn.boul2gom.com:443"
      NB_SETUP_KEY: ${NETBIRD_CLIENT_SETUP_KEY}
    healthcheck:
      test: ["CMD", "/usr/local/bin/netbird", "status", "--check", "ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      
networks:
  gateway-network:
    driver: bridge
    name: gateway-network
  proxy-network:
    driver: bridge
    name: proxy-network
  data-network:
    external: true