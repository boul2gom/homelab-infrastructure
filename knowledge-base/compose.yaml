name: knowledge-base

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      
services:
  memos:
    <<: *defaults
    image: neosmemo/memos:26.11.0
    container_name: memos
    networks:
      - data-network
    volumes:
      - /srv/containers/Memos:/var/opt/memos
    environment:
      MEMOS_PORT: 5230
      MEMOS_LOG_LEVEL: warn
      MEMOS_DRIVER: postgres
      MEMOS_DSN: postgres://memos:${MEMOS_DB_PASSWORD}@postgres:5432/memos?sslmode=disable
    labels:
      proxy.aliases: memos
      proxy.idle_timeout: 15m
      proxy.memos.homepage.name: "Memos"
      proxy.memos.homepage.icon: "@selfhst/memos.png"
      proxy.memos.homepage.category: "Knowledge"
      
  iframely:
    <<: *defaults
    image: makeplane/iframely:v2.5.7
    entrypoint: ["node", "server.js"]
    container_name: iframely
    networks:
      - data-network
    volumes:
      - /srv/containers/Iframely/config.local.js:/iframely/config.local.js
    environment:
      PORT: "8061"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8061/health_check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s 
      
  outline:
    <<: *defaults
    image: docker.getoutline.com/outlinewiki/outline:1.12.0
    container_name: outline
    networks:
      - data-network
    environment:
      URL: "https://wiki.boul2gom.com"
      PORT: "3000"
      NODE_ENV: "production"
      DEFAULT_LANGUAGE: "en_US"
      WEB_CONCURRENCY: "1"
      
      SECRET_KEY: "${OUTLINE_SECRET_KEY}"
      UTILS_SECRET: "${OUTLINE_UTILS_SECRET}"
      
      DATABASE_URL: "postgres://outline:${OUTLINE_DB_PASSWORD}@postgres:5432/outline"
      PGSSLMODE: "disable"
      
      REDIS_URL: "redis://redis:6379"
      
      OIDC_CLIENT_ID: "${OUTLINE_OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OUTLINE_OIDC_CLIENT_SECRET}"
      OIDC_AUTH_URI: "https://auth.boul2gom.com/authorize"
      OIDC_TOKEN_URI: "https://auth.boul2gom.com/api/oidc/token"
      OIDC_USERINFO_URI: "https://auth.boul2gom.com/api/oidc/userinfo"
      OIDC_LOGOUT_URI: "https://auth.boul2gom.com/logout"
      OIDC_USERNAME_CLAIM: "preferred_username"
      OIDC_DISPLAY_NAME: "Pocket ID"
      OIDC_SCOPES: "openid profile email groups"
      FORCE_HTTPS: "true"
      
      FILE_STORAGE: "s3"
      AWS_ACCESS_KEY_ID: "${OUTLINE_S3_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${OUTLINE_S3_SECRET_KEY}"
      AWS_REGION: "eu-west-3"
      AWS_S3_UPLOAD_BUCKET_URL: "https://assets.boul2gom.com"
      AWS_S3_UPLOAD_BUCKET_NAME: "outline"
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_S3_ACL: "private"
      AWS_S3_UPLOAD_METHOD: "post"

      SMTP_HOST: "smtp.resend.com"
      SMTP_PORT: "465"
      SMTP_USERNAME: "resend"
      SMTP_PASSWORD: "${RESEND_API_KEY}"
      SMTP_FROM_EMAIL: "Louis - Wiki <noreply-wiki@boul2gom.com>"
      SMTP_SECURE: "true"
      
      GITHUB_CLIENT_ID: "${OUTLINE_GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${OUTLINE_GITHUB_CLIENT_SECRET}"
      GITHUB_APP_NAME: "boul2gom-outline"
      GITHUB_APP_ID: "${OUTLINE_GITHUB_APP_ID}"
      GITHUB_APP_PRIVATE_KEY: "${OUTLINE_GITHUB_APP_PRIVATE_KEY}"
      
      IFRAMELY_URL: "http://iframely:8061"
      ALLOWED_PRIVATE_IP_ADDRESSES: "172.19.0.0/16" # The docker network
      
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_REQUESTS: "1000"
      RATE_LIMITER_DURATION_WINDOW: "60"
      LOG_LEVEL: "info"
      ENABLE_UPDATES: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/_health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      proxy.aliases: wiki
      proxy.idle_timeout: 15m
      proxy.wiki.homepage.name: "Outline"
      proxy.wiki.homepage.icon: "@selfhst/outline.svg"
      proxy.wiki.homepage.category: "Knowledge"

networks:
  default:
    name: knowledge-network
  data-network:
    external: true