name: books-library

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      
services:
  calibre:
    <<: *defaults
    image: lscr.io/linuxserver/calibre:9.18.0
    container_name: calibre
    security_opt:
      - seccomp:unconfined
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/containers/Calibre/Config:/config
      - /srv/containers/Calibre/Library:/books
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      PASSWORD: ${CALIBRE_PASSWORD}
      CUSTOM_USER: ${CALIBRE_USER}
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:8080/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s
    labels:
      proxy.aliases: books-admin
      proxy.books-admin.port: "8080"
      proxy.idle_timeout: 15m
      proxy.#1.middlewares.oidc:
      proxy.books-admin.homepage.name: "Calibre"
      proxy.books-admin.homepage.icon: "@selfhst/calibre.svg"
      proxy.books-admin.homepage.category: "Books"

  calibre-web:
    <<: *defaults
    image: lscr.io/linuxserver/calibre-web:0.6.27
    container_name: calibre-web
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/containers/Calibre/Web:/config
      - /srv/containers/Calibre/Library:/books
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      DOCKER_MODS: linuxserver/mods:universal-calibre
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:8083/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s
    labels:
      proxy.aliases: books
      proxy.idle_timeout: 15m
      proxy.books.homepage.name: "Calibre Web"
      proxy.books.homepage.icon: "@selfhst/calibre-web.svg"
      proxy.books.homepage.category: "Books"

networks:
  default:
    name: books-network